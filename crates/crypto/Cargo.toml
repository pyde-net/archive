[package]
name = "pyde-crypto"
license.workspace = true
version.workspace = true
edition = "2021"

[dependencies]
p3-goldilocks = "0.5"
p3-field = "0.4"
p3-poseidon2 = "0.4"
p3-symmetric = "0.4"
falcon-rs = { version = "0.2", default-features = false, features = ["getrandom"] }
ml-kem = { version = "0.3.0-rc.0", default-features = false, features = ["getrandom"] }
# Constant-time comparison primitives. Used to compare MACs / secret
# material without leaking timing side-channels. Default features
# pull in `std`; we're no_std so turn them off.
subtle = { version = "2", default-features = false }
# Audit 358: ZeroizeOnDrop on secret-key / share types so drop()
# overwrites the bytes with zeros instead of leaving them in
# deallocated heap pages where a later allocation, swap-to-disk
# page, or core dump could read them. `default-features = false`
# keeps no_std compatibility; `derive` enables the proc-macro,
# `alloc` enables Zeroize for `Vec<u8>` (our SK/share storage).
zeroize = { version = "1", default-features = false, features = ["alloc", "derive"] }

[[bench]]
name = "poseidon2_bench"
harness = false

[[bench]]
name = "falcon_bench"
harness = false

[[bench]]
name = "threshold_bench"
harness = false

[[bench]]
name = "vrf_bench"
harness = false

[lints]
workspace = true
