[package]
name = "pyde-dev"
license.workspace = true
version.workspace = true
edition = "2021"
description = "Pyde smart contract development framework"

[[bin]]
name = "pyde-dev"
path = "src/main.rs"

[dependencies]
# Compiler
otic = { path = "../otic" }
pyde-vm = { path = "../pvm" }
pyde-crypto = { path = "../crypto" }
ethnum = "1.5.2"

# CLI
clap = { version = "4", features = ["derive"] }

# Config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# File system
glob = "0.3"
sha2 = "0.10"
hex = "0.4"

# Wallet encryption
aes-gcm = "0.10"
rand = "0.9"
# Audit 387: silent terminal input for password prompts so the
# typed passphrase isn't echoed onto the operator's screen
# (shoulder-surf / screencast leak).
rpassword = "7"
# Memory-hard KDF for keystore passphrases (audit 306).
argon2 = "0.5"
# Audit 358: Zeroizing<[u8; 32]> for the AES key derived from
# the wallet password — prevents core-dump / freed-stack
# disclosure of the encryption key.
zeroize = { version = "1", features = ["alloc"] }
pyde-account = { path = "../account" }
pyde-tx = { path = "../tx" }

# Deploy (RPC)
reqwest = { version = "0.12", features = ["json", "blocking"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# Audit 388: exact-match host parsing for dev-key gate.
url = "2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
