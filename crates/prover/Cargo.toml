[package]
name = "pyde-prover"
version = "0.2.0"
edition = "2021"

[features]
default = ["parallel"]
parallel = ["p3-maybe-rayon/parallel"]

[dependencies]
pyde-crypto = { path = "../crypto" }
pyde-account = { path = "../account" }
pyde-vm = { path = "../pvm" }
pyde-aot = { path = "../aot" }

# Plonky3 primitives + proving infrastructure
p3-field = "0.2"
p3-air = "0.2"
p3-uni-stark = "0.2"
p3-goldilocks = "0.2"
p3-challenger = "0.2"
p3-commit = "0.2"
p3-fri = "0.2"
p3-merkle-tree = "0.2"
p3-poseidon2 = "0.2"
p3-symmetric = "0.2"
p3-dft = "0.2"
p3-matrix = "0.2"
p3-maybe-rayon = "0.2"

# Serialization + compression
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
zstd = "0.13"
