# Canonical 16-validator / 3-region testnet topology (task 078).
#
# Hand the path to this file to `pyde testnet --validators 16 --node-addrs
# ./crates/node/testdata/testnet-16v-3region.toml`. Each `[[nodes]]` entry
# corresponds to node-N in the generated output directory and supplies the
# (region, host, port) tuple that ends up baked into:
#
#   * the bootstrap_peers entries every other node sees
#   * the [network].port that this node binds locally
#   * a `# region:` comment at the top of this node's config.toml so
#     operators can match the directory to their cloud target at a glance
#
# Customise hosts before running. The `validator-N.testnet.pyde.network`
# names below are placeholders — substitute your actual DNS records (or
# raw IPs) before regenerating, then commit the resulting per-node
# directories to your deployment repo.
#
# Region distribution: 6 / 5 / 5 across us-east, eu-west, ap-southeast
# matches the canonical 3-region geography we plan to operate against.
# 16 validators yields 11/16 = 69% honest threshold, comfortably past
# the 2f+1 BFT bound (need 11 of 16) so a full-region outage of 5 nodes
# still leaves a quorum.

[[nodes]]
index = 0
region = "us-east-1"
host = "validator-0.testnet.pyde.network"
port = 30303

