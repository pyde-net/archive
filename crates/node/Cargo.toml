[package]
name = "pyde-node"
license.workspace = true
version.workspace = true
edition = "2021"

[[bin]]
name = "pyde"
path = "src/main.rs"

[dependencies]
# Workspace crates
pyde-crypto = { path = "../crypto" }
pyde-vm = { path = "../pvm" }
pyde-aot = { path = "../aot" }
pyde-state = { path = "../state" }
pyde-account = { path = "../account" }
pyde-tx = { path = "../tx" }
pyde-consensus = { path = "../consensus" }
pyde-mempool = { path = "../mempool" }
pyde-net = { path = "../net" }
pyde-slashing = { path = "../slashing" }
rayon = "1.10"
libp2p = { version = "0.54", features = ["quic", "gossipsub", "kad", "noise", "yamux", "tokio", "macros", "identify", "request-response", "cbor", "serde"] }
serde_json = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Config
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Metrics
metrics = "0.24"
metrics-exporter-prometheus = "0.16"

# RPC
jsonrpsee = { version = "0.24", features = ["server", "macros"] }
# TPL-931: needed to define the per-connection rate-limit middleware
# as a `tower::Layer<S>` for jsonrpsee's `set_rpc_middleware`. Pinned
# to the same major version jsonrpsee 0.24 uses (`tower = "0.4"`).
tower = "0.4"

# WebSocket subscriptions (bypasses jsonrpsee sink delivery bug)
tokio-tungstenite = "0.24"
futures-util = "0.3"

# Storage
rocksdb = "0.24"

# VM types
ethnum = "1.5.2"

# Misc
directories = "5"
hex = "0.4"
sparse-merkle-tree = "0.6"
# Audit 347: bounded LRU for the faucet rate-limiter map. Same
# version pyde-state already uses — reuses workspace dep cache.
lru = "0.16"
# Validator keystore encryption (audit 221).
aes-gcm = "0.10"
rand = "0.9"
# Memory-hard KDF for keystore passphrases (audit 306). Argon2id
# replaces the prior single-iteration Poseidon2 KDF; same crate
# is used in pyde-rust-sdk + pyde-dev so all three keystore
# implementations share compatible parameters.
argon2 = "0.5"
# Audit 358: `Zeroizing<[u8; 32]>` wrapper for the AES key
# derived from the operator passphrase. Without this the
# stack-allocated key would survive in the freed stack frame
# until the next function call clobbers it; a process core
# dump captured between keystore-load and the next syscall
# would leak the encryption key.
zeroize = { version = "1", features = ["alloc"] }

# Terminal dashboard (--tui flag). Reads from the same metrics
# snapshot the Prometheus exporter publishes; refresh @1Hz adds
# <1% CPU. crossterm is the cross-platform backend ratatui uses
# for keyboard/raw-mode handling.
ratatui = "0.29"
crossterm = "0.28"

[dev-dependencies]
reqwest = { version = "0.12", features = ["json", "blocking"] }
otic = { path = "../otic" }
tempfile = "3"
pyde-rust-sdk = { path = "../pyde-rust-sdk" }

[[bench]]
name = "rpc_bench"
harness = false

[lints]
workspace = true
