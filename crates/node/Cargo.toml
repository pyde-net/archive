[package]
name = "pyde-node"
license.workspace = true
version = "0.1.0"
edition = "2021"

[[bin]]
name = "pyde"
path = "src/main.rs"

[dependencies]
# Workspace crates
pyde-crypto = { path = "../crypto" }
pyde-vm = { path = "../pvm" }
pyde-aot = { path = "../aot" }
pyde-state = { path = "../state" }
pyde-account = { path = "../account" }
pyde-tx = { path = "../tx" }
pyde-consensus = { path = "../consensus" }
pyde-mempool = { path = "../mempool" }
pyde-net = { path = "../net" }
pyde-slashing = { path = "../slashing" }
rayon = "1.10"
libp2p = { version = "0.54", features = ["quic", "gossipsub", "kad", "noise", "yamux", "tokio", "macros", "identify", "request-response", "cbor", "serde"] }
serde_json = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Config
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Metrics
metrics = "0.24"
metrics-exporter-prometheus = "0.16"

# RPC
jsonrpsee = { version = "0.24", features = ["server", "macros"] }

# WebSocket subscriptions (bypasses jsonrpsee sink delivery bug)
tokio-tungstenite = "0.24"
futures-util = "0.3"

# Storage
rocksdb = "0.24"

# VM types
ethnum = "1.5.2"

# Misc
directories = "5"
hex = "0.4"
sparse-merkle-tree = "0.6"

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
otic = { path = "../otic" }
tempfile = "3"

[[bench]]
name = "rpc_bench"
harness = false

[lints]
workspace = true
